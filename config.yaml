# =============================================================================
# DC Capacity Optimizer — Configuration
# =============================================================================
# Single source of truth for synthetic data generation, optimization defaults,
# and Streamlit app UI controls. Edit values here instead of changing code.
# =============================================================================

schema: tenbosch.scmo_poc

# -----------------------------------------------------------------------------
# Synthetic data generation
# Consumed by the "Generate Synthetic Data" notebook.
# -----------------------------------------------------------------------------
synthetic_data:
  random_seed: 42

  # NOTE: The DC list is sourced from `tenbosch.scmo_poc.distribution_centers`
  # (filtered to rows where `facility_type = 'Wholesale DC'`), NOT generated here.
  # To change which DCs are in scope, edit that table — there is no n_dcs config.
  distribution_centers:
    facility_type: "Wholesale DC"        # filter applied when reading the table

  skus:
    n_skus: 20
    id_prefix: "SKU-"
    id_padding: 4                       # → SKU-0001 … SKU-0020
    units_per_case_choices:         [6, 12, 24, 36]
    cases_per_pallet_choices:       [20, 30, 40, 50]

    # Pharma-distribution product mix. Each SKU picks a category uniformly,
    # then draws its dimensional and economic params from that category's
    # ranges. Ranges are tuned so the cross-category average roughly matches
    # the prior global ranges, keeping storage/throughput utilization stable.
    # `cold_ratio` is the per-category probability a given SKU is COLD-chain
    # (2-8°C); the rest are AMBIENT. Vaccines are always cold; brand/generic
    # split (biologics & injectables → cold). Everything else is ambient.
    categories:
      - name: "brand-name pharmaceuticals"
        cold_ratio: 0.30
        unit_cube_ft3:                 {min: 0.1, max: 0.5}
        unit_weight_lbs:               {min: 0.5, max: 3.0}
        revenue_per_unit:              {min: 50.0, max: 500.0}
        cogs_per_unit:                 {min: 10.0, max: 100.0}
        holding_cost_per_unit_per_day: {min: 0.05, max: 0.30}

      - name: "generic pharmaceuticals"
        cold_ratio: 0.15
        unit_cube_ft3:                 {min: 0.1, max: 0.4}
        unit_weight_lbs:               {min: 0.5, max: 2.5}
        revenue_per_unit:              {min: 5.0, max: 50.0}
        cogs_per_unit:                 {min: 2.0, max: 15.0}
        holding_cost_per_unit_per_day: {min: 0.02, max: 0.10}

      - name: "vaccines"
        cold_ratio: 1.00
        # Cold-chain premium drives the higher holding cost band.
        unit_cube_ft3:                 {min: 0.1, max: 0.3}
        unit_weight_lbs:               {min: 0.5, max: 2.0}
        revenue_per_unit:              {min: 30.0, max: 200.0}
        cogs_per_unit:                 {min: 8.0, max: 60.0}
        holding_cost_per_unit_per_day: {min: 0.10, max: 0.50}

      - name: "over-the-counter medicines"
        cold_ratio: 0.00
        unit_cube_ft3:                 {min: 0.2, max: 0.8}
        unit_weight_lbs:               {min: 1.0, max: 5.0}
        revenue_per_unit:              {min: 5.0, max: 40.0}
        cogs_per_unit:                 {min: 1.0, max: 12.0}
        holding_cost_per_unit_per_day: {min: 0.02, max: 0.10}

      - name: "health and beauty products"
        cold_ratio: 0.00
        unit_cube_ft3:                 {min: 0.3, max: 1.2}
        unit_weight_lbs:               {min: 1.0, max: 8.0}
        revenue_per_unit:              {min: 5.0, max: 30.0}
        cogs_per_unit:                 {min: 1.0, max: 10.0}
        holding_cost_per_unit_per_day: {min: 0.01, max: 0.08}

      - name: "medical supplies"
        cold_ratio: 0.00
        unit_cube_ft3:                 {min: 0.5, max: 2.0}
        unit_weight_lbs:               {min: 2.0, max: 12.0}
        revenue_per_unit:              {min: 10.0, max: 80.0}
        cogs_per_unit:                 {min: 3.0, max: 25.0}
        holding_cost_per_unit_per_day: {min: 0.02, max: 0.12}

      - name: "medical equipment"
        cold_ratio: 0.00
        unit_cube_ft3:                 {min: 1.0, max: 3.0}
        unit_weight_lbs:               {min: 5.0, max: 25.0}
        revenue_per_unit:              {min: 100.0, max: 1000.0}
        cogs_per_unit:                 {min: 30.0, max: 300.0}
        holding_cost_per_unit_per_day: {min: 0.05, max: 0.25}

  planning:
    # Dates are anchored to date.today() at generation time — the notebook
    # uses today as the planning start_date and today-1 as the inventory
    # snapshot_date. History extends 365 days back; forward plan goes 90
    # days out. There is intentionally no start_date / snapshot_date key
    # here; pinning them would freeze the data in time.
    n_periods: 90                       # forward planning horizon (days)
    history_days: 365                   # historical actuals window ending day before today

  demand:
    # Daily demand per SKU. With n_skus=20 and midpoint(50–250)=150, baseline
    # is ~3K units/day per DC — well inside dc_capacity.max_daily_throughput_units
    # (20–40K) even after growth + anomaly spikes. Out-of-bound demand
    # forces unfulfilled orders → inventory accumulation → runaway storage %.
    base_units_per_sku:  {min: 50, max: 250}
    daily_variance:      {min: 0.7, max: 1.3}
    confidence:          {min: 0.7, max: 0.95}
    forecast_source: STATISTICAL_MODEL
    # Per-SKU annual growth rate, sampled once. Applied as a multiplicative
    # factor (1 + g)^(days_since_history_start / 365) to both demand_units
    # and outbound units. SKU at start of history ≈ base; at today ≈ base×(1+g);
    # at +90 days ≈ base × (1+g)^1.25. Visible trend, small enough that
    # LP capacities still fit. Inbound is sized off demand so it grows too.
    growth:
      annual_rate_rng: {min: 0.01, max: 0.10}
    # Forecast-vs-actual accuracy for historical rows. Each SKU draws one
    # MAPE and one bias from these ranges; daily actuals = forecast × (1+bias)
    # × (1+N(0,mape)) clipped to ±3σ. Future rows leave actual_units NULL.
    accuracy:
      mape_per_sku_rng: {min: 0.05, max: 0.30}
      bias_pct_rng:     {min: -0.12, max: 0.12}
    # Demand anomalies — explainable shocks in the history window that fall
    # outside normal MAPE noise. Each SKU rolls 1–3 events over the year,
    # each event lands on one (DC, SKU, date-range) and multiplies actual_units
    # by a spike or drop multiplier. Events are logged in the demand_anomalies
    # table so the demo can attribute the accuracy miss to a named reason.
    anomalies:
      events_per_sku_rng:    {min: 1, max: 3}
      spike_probability:     0.5
      spike_multiplier_rng:  {min: 1.5, max: 3.0}
      drop_multiplier_rng:   {min: 0.0, max: 0.5}
      duration_days_rng:     {min: 1, max: 3}
      reasons_spike:
        - SEASONAL_SURGE
        - DEMAND_SHOCK
        - MARKET_EVENT
      reasons_drop:
        - SEASONAL_DROP
        - SUPPLY_DISRUPTION
        - MARKET_EVENT

  inventory:
    # snapshot_date is derived at runtime as today - 1 day (see planning above).
    # Inventory is now sized by days_of_supply × avg_daily_demand per (DC, SKU).
    # This produces realistic on-hand levels that bridge to the next inbound
    # receipt and keep storage % roughly stable across the horizon. The earlier
    # `on_hand_units` and `target_storage_utilization` knobs are deprecated.
    days_of_supply:   {min: 5, max: 10}
    allocated_ratio: 0.1
    in_transit_units: {min: 0, max: 500}

  dc_capacity:
    storage_positions:           {min: 6000,  max: 12000}
    # Sized so realistic inventory (days_of_supply × demand) lands around 60%
    # utilization on average. Bumped up from 40-80K — the smaller capacity
    # would have made the network look chronically over capacity.
    storage_cube_ft3:            {min: 150000, max: 250000}
    # Per-DC fraction of total storage_cube_ft3 reserved for cold (2-8°C).
    # Each DC draws independently so the network shows varied cold pressure.
    cold_storage_ratio_rng:      {min: 0.15, max: 0.25}
    rack_ratio: 0.75
    pick_locations:              {min: 1000, max: 2500}
    inbound_dock_doors:          {min: 8,    max: 18}
    outbound_dock_doors:         {min: 10,   max: 22}
    max_daily_inbound_pallets:   {min: 120,  max: 250}
    max_daily_outbound_pallets:  {min: 150,  max: 300}
    max_daily_inbound_cases:     {min: 4000, max: 7000}
    max_daily_outbound_cases:    {min: 5000, max: 8000}
    max_daily_throughput_units:  {min: 20000, max: 40000}
    max_concurrent_trailers:     {min: 15, max: 30}
    utilization_target_pct: 0.85

  labor:
    functions: [RECEIVING, PICKING, PACKING, SHIPPING]
    shift_id: "1ST"
    headcount_per_function: {min: 15, max: 30}
    hours_per_shift: 8.0
    available_factor: {min: 0.85, max: 0.95}
    overtime_factor: 0.25
    labor_cost_per_hour: 25.0
    overtime_cost_per_hour: 37.5
    temp_labor_hours: {min: 20, max: 60}
    temp_labor_cost_per_hour: 30.0

  throughput:
    units_per_labor_hour: {min: 30, max: 80}
    rate_source: ENGINEERED_STANDARD

  inbound:
    # Demand-aware inbound: each (DC, SKU)'s receipts over the horizon total
    # ≈ total_demand_units × coverage_ratio, split across n_receipts_per_horizon
    # arrival days. Keeps storage % roughly stable instead of climbing.
    coverage_ratio:          {min: 0.95, max: 1.05}
    n_receipts_per_horizon:  {min: 4, max: 12}
    supplier_id:             {min: 100, max: 200}
    # Historical receipt actuals for past scheduled_date rows.
    actuals:
      on_time_rate:   0.82
      delay_days_rng: {min: 1, max: 5}
      fill_rate_rng:  {min: 0.90, max: 1.05}

  outbound:
    probability_per_sku_day: 0.7
    units:                   {min: 200, max: 2000}
    priorities: [CRITICAL, HIGH, MEDIUM, LOW]
    carriers:   [FedEx, UPS, XPO, SAIA]
    # Historical ship actuals for past scheduled_ship_date rows.
    actuals:
      on_time_rate:   0.90
      delay_days_rng: {min: 1, max: 3}
      fill_rate_rng:  {min: 0.92, max: 1.03}

# -----------------------------------------------------------------------------
# National Distribution Center (NDC) — pharma cross-dock tier above the WDCs.
# Pharma manufacturers ship into the NDC; everything must depart for a WDC
# within `sla_dwell_hours` (24h). No storage at the NDC by spec.
# Consumed by the generator notebook (ndc_capacity, ndc_inbound, ndc_outbound)
# and by the app's NDC detail view (which also runs a pure-Python what-if
# simulator on top of these tables).
# -----------------------------------------------------------------------------
ndc:
  active_dc_ids: ["DC-101"]              # extend to DC-102 once DC-101 settles

  capacity:
    max_hourly_inbound_pallets:    {min: 80, max: 120}
    max_hourly_outbound_pallets:   {min: 80, max: 120}
    max_hourly_throughput_pallets: {min: 70, max: 110}
    inbound_dock_doors:            {min: 20, max: 32}
    outbound_dock_doors:           {min: 24, max: 36}
    sla_dwell_hours: 24.0

  simulation:
    daily_inbound_pallets:   {min: 1400, max: 2000}   # ≈ 60-85 pallets/hr avg
    pallets_per_pharma_load: {min: 18,   max: 26}
    suppliers:
      [Pfizer, Merck, AbbVie, JnJ, Lilly, Roche, Novartis, BMS, GSK, Sanofi]
    manufacturer_carriers:
      [PharmaExpress, MedFreight, ColdChainLogix, RxLine, SafeShip]
    # 24 hour-of-day weights (0=midnight … 23=11pm); skew toward daytime.
    arrival_pattern_hour_weights:
      [1, 1, 1, 2, 3, 5, 7, 9, 9, 8, 7, 6, 7, 8, 7, 6, 5, 4, 3, 2, 2, 1, 1, 1]
    dwell_hours_mean: 14.0
    dwell_hours_stddev: 6.0
    dwell_hours_max: 30.0                # truncates the tail
    sla_miss_target_pct: 0.07            # ≈ 7% of pallets exceed 24h

# -----------------------------------------------------------------------------
# Optimization defaults
# Consumed by the optimization notebook and app.py.
# -----------------------------------------------------------------------------
optimization:
  default_regular_labor_cost_per_hour: 25.0
  default_overtime_labor_cost_per_hour: 37.5
  default_max_regular_hours_per_period: 800.0
  default_max_overtime_hours_per_period: 200.0
  default_throughput_rate_units_per_hour: 50.0

  # Solvers attempted in order; first one that imports wins.
  # HiGHS is 5–20× faster than CBC on LPs of this shape.
  solver_preference: ["highs", "cbc"]

  penalties:
    storage_ambient: 5.0   # $ / cu ft / day — ambient overflow penalty
    storage_cold:   15.0   # $ / cu ft / day — cold overflow (3× ambient: reefers + spoilage risk)
    throughput: 2.0        # $ / unit
    outbound: 50.0         # $ / pallet
    inbound: 75.0          # $ / pallet

  # Used only when a dc_capacity row is missing for a given DC
  fallback_capacities:
    max_storage: 100000.0          # legacy combined — kept for back-compat
    max_ambient_storage: 80000.0
    max_cold_storage: 20000.0
    max_daily_throughput: 50000.0
    max_inbound_pallets: 200.0
    max_outbound_pallets: 250.0

  # Placeholder — opt-in aggregation knobs for the future "thousands of SKUs"
  # path. When enabled, the LP solves at SKU-level for the top-N SKUs by demand
  # and rolls the rest up to the chosen dimension. No code path consumes these
  # yet; documented here so a follow-up PR can wire it without a schema change.
  aggregation:
    enabled: false
    top_n_skus: 500
    rollup_other_to: "product_category"

# -----------------------------------------------------------------------------
# Streamlit app UI
# Consumed by app.py.
# -----------------------------------------------------------------------------
app:
  cache_ttl_seconds: 300

  penalty_sliders:
    storage_ambient: {min: 0.0, max: 50.0,  default: 5.0,  step: 0.5}
    storage_cold:    {min: 0.0, max: 100.0, default: 15.0, step: 1.0}
    throughput:      {min: 0.0, max: 10.0,  default: 2.0,  step: 0.25}
    outbound:        {min: 0.0, max: 200.0, default: 50.0, step: 5.0}
    inbound:         {min: 0.0, max: 200.0, default: 75.0, step: 5.0}

  capacity_multipliers:
    storage:    {min: 0.5, max: 3.0, default: 1.0, step: 0.1}
    throughput: {min: 0.5, max: 3.0, default: 1.0, step: 0.1}
